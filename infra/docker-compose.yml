services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paya
      POSTGRES_PASSWORD: paya_dev_password
      POSTGRES_DB: paya_control
    ports:
      - "5432:5432"
    volumes:
      - paya_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  paya_postgres_data:
